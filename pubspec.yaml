name: homeplace
description: Flutter clients for connecting to a self-hosted HomePlace server.
publish_to: 'none'
version: 0.5.22+38

environment:
  sdk: ^3.13.3

dependencies:
  crypto: ^3.0.6
  cupertino_icons: ^1.0.8
  device_info_plus: ^12.1.0
  file_picker: ^10.3.3
  flutter:
    sdk: flutter
  flutter_local_notifications: ^19.4.2
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^10.0.0
  homeplace_background_files:
    path: packages/homeplace_background_files
  image_picker: ^1.2.1
  flutter_image_compress: ^2.4.0
  mime: ^2.0.0
  mobile_scanner: ^7.1.2
  package_info_plus: ^8.3.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  workmanager: ^0.10.10

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  generate: true
  uses-material-design: true
  fonts:
    - family: Onest
      fonts:
        - asset: assets/fonts/Onest-Variable.ttf
    - family: Literata
      fonts:
        - asset: assets/fonts/Literata-Variable.ttf
  assets:
    - docs/fixtures/link-info-v1.json
    - assets/branding/catbox_black.png
    - assets/branding/catbox_white.png
