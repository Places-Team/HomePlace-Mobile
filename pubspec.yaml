name: homeplace
description: Flutter clients for connecting to a self-hosted HomePlace server.
publish_to: 'none'
version: 0.4.3+12

environment:
  sdk: ^3.13.3

dependencies:
  crypto: ^3.0.6
  cupertino_icons: ^1.0.8
  device_info_plus: ^12.1.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^19.4.2
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^10.0.0
  mobile_scanner: ^7.1.2
  package_info_plus: ^8.3.1
  shared_preferences: ^2.5.3
  workmanager: ^0.10.10

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  generate: true
  uses-material-design: true
  assets:
    - docs/fixtures/link-info-v1.json
    - assets/branding/catbox_black.png
    - assets/branding/catbox_white.png
